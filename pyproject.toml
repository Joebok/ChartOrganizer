[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartorganizer"
version = "0.1.0"
description = "Build ordered sheet-music PDF playlists"
requires-python = ">=3.13"
dependencies = ["pypdf>=5.0,<6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chartorganizer = "chartorganizer.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["chartorganizer*"]
